<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PulseBox VR — Boxing Fitness for Meta Quest</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#05060f">
<meta name="mobile-web-app-capable" content="yes">
<style>
  html, body { margin: 0; height: 100%; background: #05060f; color: #e8ecff; overflow: hidden;
    font-family: "Segoe UI", system-ui, Roboto, Helvetica, Arial, sans-serif; }
  canvas { display: block; }
  #ui { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;

  #vr { background: #22d3ff; color: #05060f; }
  #vr:disabled { opacity: .35; cursor: not-allowed; }
  #desk { background: transparent; color: #e8ecff; box-shadow: inset 0 0 0 2px #3a467f; }
  #note { color: #8fa8ff; font-size: 15px; line-height: 1.5; margin-top: 18px; min-height: 3em; }
  #help { display: none; position: fixed; left: 0; right: 0; bottom: 14px; text-align: center; color: #8fa8ff; font-size: 14px; pointer-events: none; }
</style>
</head>
<body>
<div id="ui"><div class="card">
  <h1>PULSE<span>BOX</span></h1>
  <p class="tag">Boxing fitness to the beat — jab, cross, hook, uppercut, block and dodge.</p>
  <button id="vr" disabled>Enter VR</button>
  <button id="desk">Desktop preview</button>
  <p id="note">Checking for a headset…</p>
</div></div>
